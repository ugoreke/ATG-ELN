<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ATG ELN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: split bench. Entry rail + open notebook page; one pane under 900px. Tool dock sits on the right edge in landscape, along the bottom in portrait. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#15171C; --muted:#5A6170; --line:#D3D8E0;
  --accent:#4549D1; --accent-ink:#FFFFFF; --accent-soft:#E3E4FA;
  --rec:#CC3527; --rec-soft:#FBE3E0; --ok:#1C7448; --ok-soft:#DAF0E3; --warn:#8F5B00; --warn-soft:#FBEFD6;
  --scrim:rgba(18,20,28,.45); --paper:#FFFFFF; --paper-rule:#DCE6F5;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tap:60px; --r:14px; --tabs-w:116px;
  --tab1:#33369E; --tab2:#4549D1; --tab3:#6E72DE; --tab4:#A9ACEF; --tab1-ink:#FFFFFF; --tab2-ink:#FFFFFF; --tab3-ink:#101216; --tab4-ink:#101216;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101217; --surface:#191C23; --surface-2:#20242C; --ink:#E7E9EE; --muted:#9BA2AF; --line:#313643;
  --accent:#9095FF; --accent-ink:#0D0F2E; --accent-soft:#2A2C57;
  --rec:#FF6E5E; --rec-soft:#3D1F1C; --ok:#5ED39C; --ok-soft:#173428; --warn:#E6B54A; --warn-soft:#3A2E14;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#191C23; --surface-2:#20242C; --ink:#E7E9EE; --muted:#9BA2AF; --line:#313643;
  --accent:#9095FF; --accent-ink:#0D0F2E; --accent-soft:#2A2C57;
  --rec:#FF6E5E; --rec-soft:#3D1F1C; --ok:#5ED39C; --ok-soft:#173428; --warn:#E6B54A; --warn-soft:#3A2E14;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:26px;height:26px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{white-space:nowrap;max-width:100%;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:1.02rem;font-stretch:95%;letter-spacing:.01em;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--rec);border-color:var(--rec)}
.btn.danger.armed{background:var(--rec);color:var(--surface)}
.btn.icon{padding:0;width:var(--tap)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:48px;min-width:48px;padding:0 14px;font-size:.95rem}

/* app shell */
#app{height:var(--app-h,100%);max-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
@media (min-width:900px){
  #app{grid-template-columns:var(--tabs-w) clamp(270px,27vw,350px) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  #app[data-tab="daily"],#app[data-tab="todo"],#app[data-tab="docs"]{grid-template-columns:var(--tabs-w) minmax(0,1fr)}
}
@media (max-width:899px){#app.editing .rail{display:none} #app:not(.editing) .editor{display:none}}
@media (min-width:900px){.only-narrow{display:none!important}}
#app[data-tab="daily"] .rail,#app[data-tab="todo"] .rail,#app[data-tab="docs"] .rail{display:none}
#app[data-tab="todo"] .editor,#app[data-tab="docs"] .editor{display:none}
#app:not([data-tab="todo"]):not([data-tab="docs"]) .pane{display:none}
#app[data-tab="daily"] #back{display:none}

/* tabs: a row across the top that slides sideways (four in view); a column on the left edge when the screen is wide */
.tabs{display:flex;align-items:stretch;gap:6px;min-width:0;min-height:0;background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.tabs-scroll{flex:1;min-width:0;min-height:0;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior:contain}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{flex:0 0 calc((100% - 18px) / 4);min-width:0;min-height:52px;scroll-snap-align:start;border:0;border-radius:12px;padding:0 4px;background:var(--tab-bg);color:var(--tab-ink);font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:.95rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tab[data-tab="daily"]{--tab-bg:var(--tab1);--tab-ink:var(--tab1-ink)}
.tab[data-tab="notebooks"]{--tab-bg:var(--tab2);--tab-ink:var(--tab2-ink)}
.tab[data-tab="meetings"]{--tab-bg:var(--tab3);--tab-ink:var(--tab3-ink)}
.tab[data-tab="todo"]{--tab-bg:var(--tab4);--tab-ink:var(--tab4-ink)}
.tab[data-tab="docs"]{--tab-bg:var(--surface);--tab-ink:var(--ink);border:1.5px solid var(--line)}
.tab[aria-selected="true"]{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px var(--surface)}
.tab:focus-visible{outline-offset:-3px}
.tabs .btn.icon{flex:none;min-height:52px;min-width:52px;width:52px}
@media (max-width:600px){.tab{font-size:.8rem;padding:0 2px;letter-spacing:0} .tabs .btn.icon{min-width:46px;width:46px}}
@media (min-width:900px){
  .tabs{flex-direction:column;border-bottom:0;border-right:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 8px 10px max(8px,env(safe-area-inset-left,0px))}
  .tabs-scroll{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none}
  .tab{flex:1 1 0;min-height:60px;max-height:124px;font-size:1rem}
  .tabs .btn.icon{width:100%;min-height:56px}
}
@media (max-width:899px){body.tight #app:has(.editor.composing) .tabs{display:none}}

/* rail */
.rail{display:flex;flex-direction:column;min-height:0;background:var(--surface-2);border-right:1px solid var(--line)}
.rail-head{display:flex;flex-direction:column;gap:12px;padding-block:18px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:1.6rem;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.search{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px}
.list{flex:1;min-height:0;overflow-y:auto;padding-block:10px 24px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.item{display:grid;gap:6px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1.5px solid transparent;background:transparent;min-height:72px}
.item:hover{background:var(--surface)}
.item.on{background:var(--surface);border-color:var(--accent)}
.item .t{font-family:var(--f-display);font-weight:650;font-stretch:88%;font-size:1.08rem;line-height:1.2;overflow-wrap:anywhere}
.item .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.newbtn{margin-top:6px;min-height:76px;border-style:dashed;border-width:2px;font-size:1.15rem;color:var(--accent);border-color:var(--accent);background:transparent}
.newbtn svg.i{width:30px;height:30px}
.note{color:var(--muted);font-size:.95rem;padding:12px 4px;line-height:1.5}

/* editor */
.editor{display:grid;min-height:0;min-width:0;overflow:hidden;background:var(--surface);grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "lines" "comp" "dock"}
@media (orientation:landscape) and (min-width:640px){
  .editor{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "lines dock" "comp dock"}
}
/* portrait and phones: the text box takes the tool row's place while it is open */
@media not all and (orientation:landscape) and (min-width:640px){
  .editor.composing .dock{display:none}
  .comp{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
.ed-head{grid-area:head;display:flex;flex-direction:column;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--line);min-width:0}
.ed-row{display:flex;align-items:center;gap:10px;min-width:0}
.title{flex:1;min-width:0;min-height:var(--tap);border:1.5px solid transparent;border-radius:12px;background:transparent;padding:0 10px;font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:1.55rem;letter-spacing:.005em}
.title:hover{border-color:var(--line)} .title:focus{border-color:var(--accent);outline:none;background:var(--surface-2)}
.title[readonly]{border-color:transparent!important;background:transparent!important;pointer-events:none}
.ed-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.88rem;color:var(--muted);padding-left:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pchip{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;font-size:.92rem}
.pchip.add{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
.pchip svg.i{width:20px;height:20px}
.save{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em}
.save.err{color:var(--rec)}

.lines{grid-area:lines;overflow-y:auto;min-height:0;padding-block:8px 28px;overscroll-behavior:contain}
.day{display:flex;align-items:baseline;gap:12px;padding:22px 0 8px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.day b{font-family:var(--f-display);font-weight:800;font-stretch:78%;font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase}
.day span{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.line{display:grid;grid-template-columns:4.6ch minmax(0,1fr);gap:4px 14px;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:4px}
.line.sel{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.tm{font-family:var(--f-mono);font-size:.84rem;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:8px}
.ta{width:100%;max-width:72ch;border:0;background:transparent;resize:none;padding:4px 0;line-height:1.5;overflow:hidden;min-height:1.6em;font-size:1.06rem}
.ta:focus{outline:none}
.ta.cap{font-size:.95rem;color:var(--muted)}
.ta.cap:focus{color:var(--ink)}
.shot{display:block;max-width:min(100%,560px);max-height:420px;width:auto;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--surface-2)}
.shot.ink{background:var(--paper)}
.shot.pending{opacity:.55}
.trans{font-size:.95rem;border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink);white-space:pre-wrap;max-width:72ch}
.acts{display:none;flex-wrap:wrap;gap:8px}
.line.sel .acts{display:flex}
.fixnote{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--ok);max-width:72ch}
.fixnote .mono{font-size:.8rem}
.fixnote .help{flex-basis:100%;color:var(--muted);font-size:.85rem}
.unsure{flex-basis:100%;min-width:0;max-width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink)}
.unsure .q{flex-basis:100%;font-size:.95rem}
.unsure .btn{min-height:46px;white-space:normal;text-align:left}
.unsure .other{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.unsure .other input{flex:1;width:0;min-width:0;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px}

/* composer */
.comp{grid-area:comp;border-top:1px solid var(--line);background:var(--surface-2);padding-block:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.comp-ta{width:100%;min-height:96px;max-height:38vh;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;resize:none;font-size:1.1rem;line-height:1.5}
.comp-ta:focus{border-color:var(--accent);outline:none}
.comp-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.comp-row .grow{flex:1}
.status{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--muted);min-height:24px}
.status.rec{color:var(--rec);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--rec);flex:none}
.status.rec .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.interim{font-style:italic;color:var(--muted);font-size:1rem}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.45}

/* dock */
.dock{grid-area:dock;display:flex;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.tool{flex:1;min-height:76px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:650;font-stretch:90%;font-size:.95rem;touch-action:manipulation;padding:6px 2px;white-space:nowrap;overflow:hidden}
.tool svg.i{width:30px;height:30px}
.tool:active{transform:scale(.97)}
.tool.rec{background:var(--rec);border-color:var(--rec);color:var(--surface)}
.tool[disabled]{opacity:.4}
@media (orientation:landscape) and (min-width:640px){
  .dock{flex-direction:column;border-top:0;border-left:1px solid var(--line);padding-block:12px;padding-left:12px;width:calc(124px + env(safe-area-inset-right,0px));min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .tool{flex:1 1 0;min-height:58px;max-height:118px}
}
@media (orientation:landscape) and (max-height:520px){
  :root{--tap:52px}
  .tool{min-height:52px;gap:2px;font-size:.82rem} .tool svg.i{width:24px;height:24px}
  .dock{width:calc(104px + env(safe-area-inset-right,0px));gap:6px;padding-block:8px}
  .ed-head{padding-block:8px;gap:6px} .title{font-size:1.25rem}
  .comp-ta{min-height:64px}
}

/* empty editor */
.blank{grid-area:lines;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;padding-block:40px;max-width:46ch}
.blank h2{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:2rem;line-height:1.1;text-wrap:balance}
.blank p{margin:0;color:var(--muted)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:var(--scrim)}
.panel{width:min(600px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;min-height:0;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.p-head{display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;border-bottom:1px solid var(--line)}
.p-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:1.35rem;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.p-body{flex:1;min-height:0;overflow-y:auto;padding-block:16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.p-body h3{margin:8px 0 0;font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
.field .help{font-size:.88rem;color:var(--muted)}
select.sel{min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:1rem}
textarea.box{min-height:160px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:12px;resize:vertical;line-height:1.45}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:var(--tap);padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left}
.toggle .sw{width:54px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(22px)}
.vadd{display:flex;gap:10px}
.vadd input{flex:1;min-width:0;min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px}
.vadd input:focus{border-color:var(--accent);outline:none}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{display:inline-flex;align-items:center;max-width:100%;min-height:48px;padding-left:14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:.9rem}
.term>span{min-width:0;overflow-wrap:anywhere}
.term button{width:46px;height:46px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.term button svg{width:18px;height:18px}
.term.sug{border-style:dashed;border-color:var(--accent)} .term.sug button{color:var(--accent)}
.prow{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;width:100%}
.prow .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.prow .ck{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
.prow.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prow .ck svg{width:20px;height:20px;stroke-width:3}
.pgroup{display:flex;flex-direction:column;gap:8px}
.doc{font-size:1rem;line-height:1.55;max-width:72ch}
.doc h4{font-family:var(--f-display);font-weight:750;font-stretch:88%;font-size:1.12rem;margin:18px 0 6px}
.doc p{margin:6px 0}
.doc ul,.doc ol{margin:6px 0;padding-left:1.4em}
.doc li{margin:3px 0}
.tbl{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;font-size:.9rem;min-width:100%}
.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;font-variant-numeric:tabular-nums}
.tbl tr:first-child td{font-weight:700;background:var(--surface-2)}
pre.raw{white-space:pre;overflow-x:auto;font-family:var(--f-mono);font-size:.78rem;line-height:1.45;background:var(--surface-2);border-radius:10px;padding:12px;margin:0}
.answer{white-space:pre-wrap;line-height:1.55;background:var(--surface-2);border-radius:12px;padding:14px 16px;min-height:3em}
.byline{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
/* Ask chat: the sheet follows the visible height so the keyboard can't cover Send */
.sheet.ask{height:var(--app-h,100%);bottom:auto}
.sheet.ask .p-body{overflow:hidden;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));gap:12px}
.ask-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.ask-comp{display:flex;flex-direction:column;gap:10px}
.ask-comp textarea.box{min-height:72px;max-height:30vh}
.msg{border-radius:12px;padding:12px 14px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.msg.user{align-self:flex-end;max-width:88%;background:var(--accent-soft);white-space:pre-wrap}
.msg.claude{background:var(--surface-2)}
.msg.claude .doc{max-width:none}
.msg.err{border:1.5px dashed var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:700}
.msg.info{color:var(--muted);font-size:.9rem;padding-block:0}
.askq p{margin:6px 0}
.askq .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.askq .btn{white-space:normal;text-align:left;background:var(--surface)}
.askq .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.meta-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.meta-grid dt{color:var(--muted)} .meta-grid dd{margin:0;overflow-wrap:anywhere}

/* drawing */
.draw{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column}
.draw-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.draw-bar .sp{flex:1}
.swatch{width:var(--tap);height:var(--tap);border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface-2)}
.swatch i{width:24px;height:24px;border-radius:50%;display:block}
.swatch.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.swatch b{display:block;border-radius:999px;background:currentColor;width:26px}
.paper{flex:1;min-height:0;position:relative;margin:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-radius:12px;border:1px solid var(--line);overflow:hidden;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--paper-rule) 35px 36px)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.viewer .btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:14px 18px;border-radius:14px;font-size:.98rem;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
[hidden]{display:none!important}
@media (max-width:600px){
  .title{font-size:1.2rem;padding:0 6px}
  #askBtn{padding:0;width:var(--tap)} #askBtn .lbl{display:none}
  #created{display:none}
  .ed-head{padding-block:8px;gap:6px}
  .comp-row.main{flex-wrap:nowrap}
  .comp-row.main .grow{display:none}
  .comp-row.main .btn:not(.primary){padding:0;width:var(--tap)}
  .comp-row.main .btn .lbl{display:none}
  .comp-row.main .btn.primary{flex:1}
  .comp-ta{min-height:64px}
  .tool{font-size:.74rem;min-height:70px;letter-spacing:0} .dock{gap:5px}
}
body.tight .editor.composing .ed-meta,body.tight .editor.composing .chips{display:none}
body.tight .editor.composing .comp-ta{min-height:54px;max-height:24vh}
body.tight .editor.composing .ed-head{padding-block:6px}
.btn.mic.rec{background:var(--rec);border-color:var(--rec);color:var(--surface)}
.line.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.again{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0 6px}
.again .btn{border-style:dashed;border-width:2px;border-color:var(--accent);color:var(--accent);background:transparent}
/* new entry form */
.create{grid-area:lines;display:flex;flex-direction:column;gap:14px;padding-block:18px 32px;max-width:640px;min-width:0}
.create label{font-weight:700}
.create .title{border-color:var(--line);background:var(--surface-2);font-size:1.35rem}
.create .help{font-size:.88rem;color:var(--muted);margin-top:-6px}
.create .btn.primary{min-height:68px;font-size:1.15rem}
.create h2{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:1.7rem}
/* handwriting bottom actions */
.draw-actions{display:flex;gap:10px;padding-top:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.draw-actions .btn{flex:1}
.draw-actions .btn.primary{flex:1.6}
.draw .paper{margin-bottom:10px}
.added{font-family:var(--f-mono);font-size:.8rem;color:var(--ok);align-self:center}
/* To-do and Docs */
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--surface)}
.pane-head{display:flex;flex-direction:column;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--line);min-width:0}
.pane-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:1.55rem;line-height:1.1}
.pane-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:8px 28px;display:flex;flex-direction:column;gap:8px}
.pane-body h3{margin:10px 0 0;font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.todo{display:flex;align-items:flex-start;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.todo .ck{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--muted);background:var(--surface);color:transparent;display:grid;place-items:center;touch-action:manipulation}
.todo .ck svg.i{stroke-width:3}
.todo.done .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.todo .tx{flex:1;min-width:0;padding-top:12px;font-size:1.06rem;overflow-wrap:anywhere}
.todo.done .tx{color:var(--muted);text-decoration:line-through}
.todo .when{flex:none;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);padding-top:17px;white-space:nowrap}
.donehead{display:flex;align-items:center;gap:10px;min-height:var(--tap);margin-top:10px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-weight:650;text-align:left}
.donehead svg.i{transition:transform .15s} .donehead[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.skin{display:flex;flex-direction:column;gap:8px;min-height:var(--tap);padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;font-weight:700;min-width:0}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.skin .sw4{display:grid;grid-template-columns:repeat(4,1fr);height:22px;border-radius:6px;overflow:hidden}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.no-sample .needs-sample{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn:active,.tool:active{transform:none}}
</style>

function normalizeTodo(raw) {
  const d = JSON.parse(JSON.stringify(raw || {}));   /* stored data is frozen; work on a copy */
  return { items: (Array.isArray(d.items) ? d.items : []).filter(i => i && i.id && typeof i.text === "string") };
}
const todoStamp = iso => { const d = new Date(iso); return `${d.getDate()} ${MO[d.getMonth()]} ${hm(iso)}`; };
/* one write at a time, always of the newest list; a failed write is shown and retried, like lines are */
function saveTodo(items) {
  state.todo = { items }; renderTodo();
  if (!state.db) return;
  todoPending++;
  todoQueue = todoQueue.then(async () => {
    try { const at = new Date().toISOString(); await state.db.doc("logs/todo").set({ items: state.todo.items, updatedAt: at }); todoWrittenAt = at; todoProblem = ""; clearTimeout(todoRetry); }
    catch (err) {
      todoProblem = "Not saved yet (" + ((err && (err.code || err.message)) || "connection problem") + "). Retrying every few seconds; keep this page open.";
      clearTimeout(todoRetry); todoRetry = setTimeout(() => saveTodo(state.todo.items), SAVE_RETRY_MS);
    } finally { todoPending--; renderTodo(); }
  });
}
function todoRow(i) {
  return `<div class="todo${i.doneAt ? " done" : ""}" data-todo="${esc(i.id)}"><button class="ck" role="checkbox" aria-checked="${!!i.doneAt}" aria-label="${i.doneAt ? "Done" : "Not done"}: ${esc(i.text)}">${ICON.check}</button>
    <span class="tx">${esc(i.text)}</span><span class="when">${esc(todoStamp(i.doneAt || i.at))}</span>${i.doneAt ? `<button class="btn small ghost" data-tdel aria-label="Delete ${esc(i.text)}">${ICON.trash}</button>` : ""}</div>`;
}
function renderTodo() {
  if (state.tab !== "todo") return;
  const pane = $("#pane");
  if (!$("#todoForm")) pane.innerHTML = `<header class="pane-head gut"><h2>To-do</h2><div class="hint" id="todoBanner" role="alert" hidden></div>
      <form class="vadd" id="todoForm" autocomplete="off"><input id="todoNew" placeholder="Add something to do" aria-label="New to-do" enterkeyhint="done"><button class="btn primary" type="submit">${ICON.plus}Add</button></form></header>
    <div class="pane-body gut" id="todoList"></div>`;
  const problem = state.noStore ? NO_STORE : todoProblem, ban = $("#todoBanner"); ban.hidden = !problem; ban.textContent = problem;
  const active = state.todo.items.filter(i => !i.doneAt).sort(byAt);
  const done = state.todo.items.filter(i => i.doneAt).sort((a, b) => String(a.doneAt).localeCompare(String(b.doneAt)));
  $("#todoList").innerHTML = (active.length ? active.map(todoRow).join("") : `<p class="note">${state.todoLoaded || state.noStore ? (done.length ? "Nothing left to do." : "Nothing here yet. Add the first thing above.") : "Loading…"}</p>`)
    + (done.length ? `<button class="donehead" id="doneHead" aria-expanded="${todoOpen}">${ICON.chev}Done (${done.length})</button>` + (todoOpen ? done.map(todoRow).join("") : "") : "");
}
function onPaneSubmit(ev) {
  if (ev.target.id !== "todoForm") return;
  ev.preventDefault();
  const input = $("#todoNew"), text = input.value.trim();
  if (!text) { input.focus(); return; }
  if (!state.todoLoaded) { toast(state.noStore ? NO_STORE : "Your list is still loading. Try again in a moment."); return; }
  input.value = ""; input.focus();
  saveTodo([...state.todo.items, { id: uid(), text, at: new Date().toISOString(), doneAt: null }]);
}
function onPaneClick(ev) {
  const doc = ev.target.closest("[data-doc]"); if (doc) return showProtocol(doc.dataset.doc);
  if (ev.target.closest("#doneHead")) { todoOpen = !todoOpen; return renderTodo(); }
  const row = ev.target.closest("[data-todo]"); if (!row || !state.todoLoaded) return;
  const id = row.dataset.todo, del = ev.target.closest("[data-tdel]");
  if (del) return armDelete(del, () => saveTodo(state.todo.items.filter(i => i.id !== id)));
  if (ev.target.closest(".ck")) saveTodo(state.todo.items.map(i => (i.id === id ? { ...i, doneAt: i.doneAt ? null : new Date().toISOString() } : i)));
}
/* ---------- Docs: for now the protocol library to read; step-by-step protocols come later ---------- */
function renderDocs() {
  if (state.tab !== "docs") return;
  const groups = {}; state.protocols.forEach(p => (groups[p.category || "Other"] = groups[p.category || "Other"] || []).push(p));
  $("#pane").innerHTML = `<header class="pane-head gut"><h2>Docs</h2></header><div class="pane-body gut">
    <p class="note" style="padding:0">Step-by-step protocols will live here. For now this is your protocol library: tap one to read it.</p>
    ${Object.entries(groups).map(([g, ps]) => `<h3>${esc(g)}</h3><div class="pgroup">${ps.map(p => `<button class="prow" data-doc="${esc(p.id)}">${ICON.book}<span class="nm">${esc(p.title)}</span></button>`).join("")}</div>`).join("") || '<p class="note" style="padding:0">The protocol library is empty.</p>'}</div>`;
}
async function saveSettings(patch) {
  Object.assign(state.settings, patch);
  if (!state.db) return;
  try { await state.db.doc("config/settings").set({ ...state.settings }); } catch (err) { toast("Couldn't save settings: " + (err.message || err.code)); }
}
function openSettings() {
  const st = state.settings, g = state.glossary;
  const modelSel = (id, val) => `<select class="sel" id="${id}">${MODELS.map(m => `<option value="${m.id}"${m.id === val ? " selected" : ""}>${esc(m.label)}</option>`).join("")}</select>`;
  const swatch = (id, k) => `<button class="skin" type="button" data-skin="${id}" aria-pressed="${(SKINS[st.theme] ? st.theme : "default") === id}"><span class="sw4">${k.light.tabs.map(c => `<i style="background:${c}"></i>`).join("")}</span><span>${esc(k.name)}</span></button>`;
  const body = `<h3>Theme</h3>
    <div class="skins" id="sSkins">${Object.entries(SKINS).map(([id, k]) => swatch(id, k)).join("")}</div>
    <span class="help">Each theme follows your device's light or dark setting.</span>
    <h3>Claude helper</h3>
    <div class="field"><label for="sFix">Model for fixing terms and reading handwriting</label>${modelSel("sFix", st.fixModel)}<span class="help">Quick is usually enough for spelling fixes. If a named model isn't available on your plan, Claude uses the matching tier and the note under the fix says which model answered.</span></div>
    <div class="field"><label for="sAsk">Model for questions</label>${modelSel("sAsk", st.askModel)}</div>
    <button class="toggle" id="sAskPhotos" role="switch" aria-checked="${!!st.askPhotos}"><span>Send photos and handwriting with questions (slower)</span><span class="sw"></span></button>
    <button class="toggle" id="sAuto" role="switch" aria-checked="${!!st.autoFix}"><span>Fix lab terms automatically when dictation stops</span><span class="sw"></span></button>
    <h3>Dictation</h3>
    <div class="field"><label for="sLang">Language</label><select class="sel" id="sLang">${[["en-US", "English (US)"], ["en-GB", "English (UK)"], ["tr-TR", "Turkish"]].map(([v, n]) => `<option value="${v}"${v === st.lang ? " selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="field"><span class="help" id="vLearned"></span><span class="help">Fix terms learns how dictation mishears you from the corrections you accept, and uses it as evidence next time.</span><button class="btn" id="vForget" type="button">${ICON.trash}Forget</button></div>
    <h3>Lab vocabulary</h3>
    <p class="note" style="padding:0">Fix terms uses this list as its reference: anything dictation wrote that sounds like one of these terms is replaced with the term. Add a term once, spelled the way you want it written — one entry covers its whole word family, so “nucleofector” also catches nucleofection and nucleofected.</p>
    <form class="vadd" id="vForm"><input id="vNew" placeholder="Add a term, e.g. KOLF2.1J-NGN2" aria-label="New vocabulary term" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn primary" type="submit">${ICON.plus}Add</button></form>
    <input class="search" id="vFilter" type="search" placeholder="Search vocabulary" aria-label="Search vocabulary" autocomplete="off">
    <span class="help" id="vCount"></span>
    <div class="terms" id="vList"></div>
    <div class="field needs-sample"><label>Grow it from your notes</label>
      <span class="help">Claude reads your notes and suggests lab terms that aren't in the vocabulary yet. You choose which to add.</span>
      <button class="btn" id="vFind" type="button">${ICON.fix}Find terms in my notes</button>
      <div class="terms" id="vSug" hidden></div>
      <button class="btn primary" id="vAddAll" type="button" hidden>${ICON.plus}Add all</button>
    </div>
    <h3>Moving notes to Benchling</h3>
    <p class="note" style="padding:0">In a Claude Code session opened in this project's folder, say “Transfer my ATG ELN notes to Benchling.” Claude writes Daily's lines, photos and handwriting into Benchling, then moves them, unchanged, into the notebooks here that are named like the Benchling entries. Daily then shows only what is left.</p>`;
  const s = sheet("Settings", body);
  const b = s.body;
  b.querySelector("#sSkins").addEventListener("click", ev => {
    const k = ev.target.closest("[data-skin]"); if (!k) return;
    applySkin(k.dataset.skin); saveSettings({ theme: k.dataset.skin });
    b.querySelectorAll("[data-skin]").forEach(x => x.setAttribute("aria-pressed", String(x === k)));
  });
  b.querySelector("#sFix").onchange = ev => saveSettings({ fixModel: ev.target.value });
  b.querySelector("#sAsk").onchange = ev => saveSettings({ askModel: ev.target.value });
  b.querySelector("#sLang").onchange = ev => saveSettings({ lang: ev.target.value });
  b.querySelector("#sAskPhotos").onclick = ev => { const on = ev.currentTarget.getAttribute("aria-checked") !== "true"; ev.currentTarget.setAttribute("aria-checked", on); saveSettings({ askPhotos: on }); };
  b.querySelector("#sAuto").onclick = ev => { const on = ev.currentTarget.getAttribute("aria-checked") !== "true"; ev.currentTarget.setAttribute("aria-checked", on); saveSettings({ autoFix: on }); };
  const drawLearned = () => { const n = state.voice.pairs.reduce((t, p) => t + p.n, 0); b.querySelector("#vLearned").textContent = `Learned from ${n} correction${n === 1 ? "" : "s"}`; b.querySelector("#vForget").disabled = !n; };
  drawLearned();
  b.querySelector("#vForget").onclick = ev => armDelete(ev.currentTarget, () => { saveVoice({ pairs: [] }); drawLearned(); toast("Forgot what dictation got wrong."); });
  const list = b.querySelector("#vList"), filter = b.querySelector("#vFilter"), input = b.querySelector("#vNew");
  const draw = () => {
    const q = filter.value.trim().toLowerCase(); const terms = state.glossary.terms;
    const shown = terms.filter(t => !q || t.toLowerCase().includes(q));
    b.querySelector("#vCount").textContent = `${terms.length} terms` + (q ? `, ${shown.length} shown` : "") + `. ${state.protocols.length} protocols and templates are also in the library.`;
    list.innerHTML = shown.length ? shown.map(t => `<span class="term"><span>${esc(t)}</span><button data-term="${esc(t)}" aria-label="Remove ${esc(t)}">${ICON.x}</button></span>`).join("") : `<p class="note" style="padding:0">${q ? "No terms match." : "No terms yet. Add your first one above."}</p>`;
  };
  const saveTerms = async (terms, msg) => {
    if (!state.db) return false;
    const before = state.glossary.terms; state.glossary = { terms }; draw();
    try { await state.db.doc("config/glossary").set({ terms }); toast(msg); return true; }
    catch (err) { state.glossary = { terms: before }; draw(); toast("Couldn't save the vocabulary: " + (err.message || err.code)); return false; }
  };
  b.querySelector("#vForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const t = input.value.trim(); if (!t) { input.focus(); return; }
    if (state.glossary.terms.some(x => x.toLowerCase() === t.toLowerCase())) { toast(`“${t}” is already in the vocabulary.`); return; }
    input.value = ""; filter.value = ""; input.focus();
    saveTerms([t, ...state.glossary.terms], `Added “${t}”.`);
  });
  filter.addEventListener("input", draw);
  list.addEventListener("click", ev => {
    const r = ev.target.closest("[data-term]"); if (!r) return; const t = r.dataset.term;

  const sugBox = b.querySelector("#vSug"), addAll = b.querySelector("#vAddAll"), find = b.querySelector("#vFind");
  const drawSug = () => {
    const have = new Set(state.glossary.terms.map(t => t.toLowerCase())); sug = sug.filter(t => !have.has(t.toLowerCase()));
    sugBox.hidden = !sug.length; addAll.hidden = sug.length < 2;
    sugBox.innerHTML = sug.map(t => `<span class="term sug"><span>${esc(t)}</span><button data-add="${esc(t)}" aria-label="Add ${esc(t)}">${ICON.plus}</button></span>`).join("");
  };
  find.onclick = async () => {
    if (!state.sample) return;
    let text = "";
    for (const [, e] of [...state.entries.entries()].sort((x, y) => (y[1].updatedAt || "").localeCompare(x[1].updatedAt || ""))) {
      const t = `\n## ${e.title}\n` + e.blocks.map(k => [k.text, k.caption, k.transcript].filter(Boolean).join(" ")).filter(Boolean).join("\n");
      if (text.length + t.length > 60000) break; text += t;

    try {

Return only JSON: {"terms": ["..."]}

Current vocabulary: ${state.glossary.terms.join("; ")}

Entries:
${text}`, { ...modelOpts(state.settings.askModel), cache: false });
      const j = parseJSON(r.text);
      sug = [...new Set((Array.isArray(j.terms) ? j.terms : []).map(t => String(t).trim()).filter(t => t && t.length < 80))];

  window.addEventListener("eln-vocab", onVocab);

}
function view(src) {
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role", "dialog");
  v.innerHTML = `<img alt="Full size"><button class="btn icon" aria-label="Close">${ICON.x}</button>`;
  v.querySelector("img").src = src; v.onclick = () => v.remove(); document.body.appendChild(v);
}

/* ---------- screen awake while working ---------- */
let wake = null;
async function keepAwake() { try { if ("wakeLock" in navigator && !wake && document.visibilityState === "visible") { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (_) { wake = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (state.openId || dict.on)) keepAwake(); });

/* ---------- keep the app inside the visible area, above the on-screen keyboard ---------- */
const TIGHT_HEIGHT = 620, CARET_MARGIN = 12;
let fitFrame = 0;
function fitViewport() {
  const vv = window.visualViewport;
  const h = Math.round(vv ? vv.height : window.innerHeight);
  document.documentElement.style.setProperty("--app-h", h + "px");
  document.body.classList.toggle("tight", h < TIGHT_HEIGHT);
  /* Once per frame, after the new height is laid out: bring the line being edited back inside the list, then undo any scroll the browser
     gave the page itself. Doing the second without the first made iPad Safari scroll the page again to reach the caret, in a loop. */
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(() => {
    const a = document.activeElement, box = a && a.closest ? a.closest(".lines") : null;
    if (box) {
      const r = a.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (r.bottom > b.bottom) box.scrollTop += Math.min(r.bottom - b.bottom + CARET_MARGIN, r.top - b.top);
      else if (r.top < b.top) box.scrollTop -= b.top - r.top + CARET_MARGIN;
    }
    if (vv && (window.scrollY || vv.offsetTop)) window.scrollTo(0, 0);
  });
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fitViewport); visualViewport.addEventListener("scroll", fitViewport); }
window.addEventListener("resize", fitViewport);
window.addEventListener("orientationchange", () => setTimeout(fitViewport, 250));

/* ---------- static wiring ---------- */
function wireStatic() {
  let cached = ""; try { cached = localStorage.getItem("eln-skin") || ""; } catch (_) { /* storage blocked: the default shows until settings load */ }
  applySkin(cached);
  fitViewport();
  state.entries.set(DAILY, normalize({}, DAILY));
  $("#tabs").addEventListener("click", ev => { const t = ev.target.closest(".tab"); if (t && t.dataset.tab !== state.tab) setTab(t.dataset.tab); });
  $("#pane").addEventListener("click", onPaneClick);
  $("#pane").addEventListener("submit", onPaneSubmit);
  setTab(DAILY);
  $("#list").addEventListener("click", ev => { const o = ev.target.closest("[data-open]"); if (o) return openEntry(o.dataset.open); if (ev.target.closest("#newEntry")) newEntry(); });
  $("#editor").addEventListener("click", ev => { if (ev.target.closest("#blankNew")) newEntry(); });
  $("#search").addEventListener("input", ev => { state.filter = ev.target.value; renderRail(); });
  $("#openSettings").onclick = openSettings;
  $("#camInput").onchange = ev => { const f = [...ev.target.files]; ev.target.value = ""; if (f.length && state.openId) onFiles(f, "photo"); };
  $("#libInput").onchange = ev => { const f = [...ev.target.files]; ev.target.value = ""; if (f.length && state.openId) onFiles(f, "library"); };
  window.addEventListener("beforeunload", () => { for (const id of timers.keys()) flush(id); });
}
boot();
})();
